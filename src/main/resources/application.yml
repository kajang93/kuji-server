spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # ⚠️ create는 재시작마다 전체 테이블을 drop 하므로 절대 사용 금지 (데이터 유실)
      # ⚠️ update도 금지: columnDefinition으로 하드코딩된 PG enum 타입과 충돌해
      #    부팅마다 enum 재생성 → CASCADE로 컬럼이 삭제되는 문제 확인됨 (2026-07-06)
      #    스키마 변경이 필요하면 수동 SQL 또는 Flyway 마이그레이션으로 적용할 것
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # 레이지 로딩 N+1 완화: 지연 로딩 발생 시 IN 절로 최대 100건씩 묶어서 조회
        default_batch_fetch_size: 100
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB
  cloud:
    aws:
      s3:
        bucket: kuji-image # 💡 설정 완료!
      region:
        static: eu-north-1

  config:
    import: optional:classpath:application-secret.yml
server:
  port: 8080
  address: 0.0.0.0

jwt:
  # 💡 우리 서버만의 비밀키 (환경변수 또는 application-secret.yml 주입)
  secret: ${JWT_SECRET_KEY}
  # 💡 토큰 유효 시간 (밀리초 단위, 30분 = 1800000)
  expiration: 1800000
  # 💡 리프레시 토큰 유효 시간 (밀리초 단위, 14일 = 1209600000)
  refresh-expiration: 1209600000

file:
  upload-dir: uploads

toss:
  # 💡 [필수] 토스페이먼츠 시크릿 키 (환경변수 또는 application-secret.yml 주입)
  secret-key: ${TOSS_SECRET_KEY}
aligo:
  api-key: ${ALIGO_API_KEY:mock}
  user-id: ${ALIGO_USER_ID:mock}
  sender: ${ALIGO_SENDER:01022210106}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true

gemini:
  api-key: ${GEMINI_API_KEY:mock}
  # gemini-1.5-flash는 2025년 퇴역(404)되어 gemini-2.5-flash로 변경 (매일 9시 AI 브리핑 실패 원인이었음)
  model: ${GEMINI_MODEL:gemini-2.5-flash}

groq:
  api-key: ${GROQ_API_KEY:mock}
  model: ${GROQ_MODEL:llama-3.3-70b-versatile}

huggingface:
  api-key: ${HF_API_KEY:mock}

slack:
  webhook-url: ${SLACK_WEBHOOK_URL:mock}
