# 공개 상품 이미지 경로만 고정된 저장소에서 가져와 캐시합니다.
location ~ ^/media/kuji/(?<kuji_image_key>(?:boards|items|prizes)/.+)$ {
    limit_except GET { deny all; }
    resolver 169.254.169.253 valid=60s ipv6=off;
    set $kuji_image_origin kuji-image.s3.eu-north-1.amazonaws.com;
    proxy_pass https://$kuji_image_origin/$kuji_image_key;
    proxy_set_header Host $kuji_image_origin;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_ssl_server_name on;
    proxy_ssl_name $kuji_image_origin;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth 3;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
    proxy_cache kuji_images;
    proxy_cache_key $kuji_image_key;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 20s;
    proxy_cache_revalidate on;
    proxy_cache_valid 200 30d;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Kuji-Image-Cache $upstream_cache_status always;
    add_header X-Content-Type-Options nosniff always;
}

# 상품 이미지 이외의 경로는 앱 문서로 응답하지 않습니다.
location /media/kuji/ { return 404; }
