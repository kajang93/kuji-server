name: Deploy Backend to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: kuji-backend-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Inject Secret Files
        env:
          APPLICATION_SECRET_YML: ${{ secrets.APPLICATION_SECRET_YML }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ENABLED: ${{ secrets.THREADS_ENABLED }}
          THREADS_REPLY_MONITOR_ENABLED: ${{ secrets.THREADS_REPLY_MONITOR_ENABLED }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          TOSS_SECRET_KEY: ${{ secrets.TOSS_SECRET_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          METRICOOL_API_TOKEN: ${{ secrets.METRICOOL_API_TOKEN }}
          METRICOOL_USER_ID: ${{ secrets.METRICOOL_USER_ID }}
          METRICOOL_BLOG_ID: ${{ secrets.METRICOOL_BLOG_ID }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path

          resources = Path("src/main/resources")
          resources.joinpath("application-secret.yml").write_text(os.environ["APPLICATION_SECRET_YML"], encoding="utf-8")
          resources.joinpath("firebase-service-account.json").write_text(os.environ["FIREBASE_SERVICE_ACCOUNT_JSON"], encoding="utf-8")

          threads = {}
          for env_key, property_key in (("THREADS_ACCESS_TOKEN", "access-token"), ("THREADS_USER_ID", "user-id")):
              value = os.environ.get(env_key, "").strip()
              if value:
                  threads[property_key] = value
          enabled = os.environ.get("THREADS_ENABLED", "").strip().lower()
          if enabled:
              if enabled not in ("true", "false"):
                  raise SystemExit("THREADS_ENABLED must be true or false")
              threads["enabled"] = enabled == "true"
          if threads:
              resources.joinpath("application-threads-secret.yml").write_text(json.dumps({"threads": threads}), encoding="utf-8")

          integrations = {}
          for env_key, section, property_key in (
              ("KAKAO_REST_API_KEY", "kakao", "rest-api-key"),
              ("KAKAO_CLIENT_SECRET", "kakao", "client-secret"),
              ("GOOGLE_CLIENT_ID", "google", "client-id"),
              ("NAVER_CLIENT_ID", "naver", "client-id"),
              ("NAVER_CLIENT_SECRET", "naver", "client-secret"),
              ("TOSS_SECRET_KEY", "toss", "secret-key"),
              ("SLACK_WEBHOOK_URL", "slack", "webhook-url"),
              ("METRICOOL_API_TOKEN", "metricool", "api-token"),
              ("METRICOOL_USER_ID", "metricool", "user-id"),
              ("METRICOOL_BLOG_ID", "metricool", "blog-id"),
          ):
              value = os.environ.get(env_key, "").strip()
              if value:
                  integrations.setdefault(section, {})[property_key] = value
          monitor_enabled = os.environ.get("THREADS_REPLY_MONITOR_ENABLED", "").strip().lower()
          if monitor_enabled:
              if monitor_enabled not in ("true", "false"):
                  raise SystemExit("THREADS_REPLY_MONITOR_ENABLED must be true or false")
              integrations.setdefault("threads", {})["reply-monitor"] = {"enabled": monitor_enabled == "true"}
          if integrations:
              resources.joinpath("application-integrations-secret.yml").write_text(json.dumps(integrations), encoding="utf-8")
          PYTHON

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        
      - name: Build with Gradle
        run: ./gradlew bootJar -x test

      - name: Record artifact checksum
        run: sha256sum build/libs/kuji-server-0.0.1-SNAPSHOT.jar > build/libs/kuji-server-0.0.1-SNAPSHOT.jar.sha256
        
      - name: Prepare private incoming directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          script: install -d -m 700 "$HOME/kuji-backend-incoming"

      - name: Copy jar to AWS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          source: "build/libs/kuji-server-0.0.1-SNAPSHOT.jar,build/libs/kuji-server-0.0.1-SNAPSHOT.jar.sha256"
          target: "~/kuji-backend-incoming/${{ github.run_id }}-${{ github.run_attempt }}"
          strip_components: 2

      - name: Copy image cache configuration
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          source: "scripts/nginx/*,scripts/install_image_cache.py,scripts/backup_kuji.py,scripts/backup_integrity.py,scripts/restore_kuji.py,scripts/deploy_backend.py,scripts/systemd/*"
          target: "~/kuji-backend-incoming/${{ github.run_id }}-${{ github.run_attempt }}/infra"
          strip_components: 1

      - name: Verify approval and deploy with rollback
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          command_timeout: 15m
          script: |
            set -eu
            incoming="$HOME/kuji-backend-incoming/${{ github.run_id }}-${{ github.run_attempt }}"
            sudo python3 "$incoming/infra/deploy_backend.py" --check-approval --revision "${{ github.sha }}"
            printf '%s\n' 'client_max_body_size 50M;' | sudo tee /etc/nginx/conf.d/upload_size.conf >/dev/null
            sudo python3 "$incoming/infra/install_image_cache.py"
            sudo install -d -m 700 /var/backups/kuji /etc/kuji-backup
            sudo install -m 700 "$incoming/infra/backup_kuji.py" /usr/local/sbin/kuji-backup
            sudo install -m 600 "$incoming/infra/backup_integrity.py" /usr/local/sbin/backup_integrity.py
            sudo install -m 700 "$incoming/infra/restore_kuji.py" /usr/local/sbin/kuji-restore-check
            sudo install -m 644 "$incoming/infra/systemd/kuji-backup.service" /etc/systemd/system/kuji-backup.service
            sudo install -m 644 "$incoming/infra/systemd/kuji-backup.timer" /etc/systemd/system/kuji-backup.timer
            sudo install -m 644 "$incoming/infra/systemd/kuji-restore-check.service" /etc/systemd/system/kuji-restore-check.service
            sudo install -m 644 "$incoming/infra/systemd/kuji-restore-check.timer" /etc/systemd/system/kuji-restore-check.timer
            sudo systemctl daemon-reload
            sudo systemctl enable --now kuji-backup.timer kuji-restore-check.timer
            sudo python3 "$incoming/infra/deploy_backend.py" --artifact "$incoming/kuji-server-0.0.1-SNAPSHOT.jar" --checksum "$incoming/kuji-server-0.0.1-SNAPSHOT.jar.sha256" --revision "${{ github.sha }}"
